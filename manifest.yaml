manifestVersion: 1
name: "@kneel/sig-distgit"
version: "2026.09.29.2"
description: "CentOS Cloud SIG dist-git tooling. The model is a read-only fan-out scan of a SIG dist-git group on gitlab.com: lists every project, fetches each <name>.spec at a branch, resolves its Version/Release/Epoch (expanding RDO %global upstream_version macros), reads the lookaside `sources` state, and persists per-package facts plus a scan-summary. Also ships the workflow-scope `sig-promote` report, which joins those spec versions with koji promotion-tag NVRs and upstream OpenStack releases into a per-package candidate→testing→release matrix with a build/promote action queue."

repository: https://github.com/NeilHanlon/swamp-sig-distgit

additionalFiles:
  - README.md
  - LICENSE.txt

# sig_distgit.ts is the group-scoped model (one instance per SIG dist-git group).
# It imports two pure library modules bundled with it — extensions/lib/spec_version.ts
# (RPM Version/Release/Epoch + %global macro resolution) and
# extensions/lib/spec_sources.ts (lookaside `sources` file parsing) — which are
# not separately-registered model types.
#
# Runtime permissions: the scan is plain Deno `fetch` against gitlab.com and needs
# `--allow-net`. An optional PAT (for higher rate limits / private groups) is read
# from a global argument, not the environment.
models:
  - sig_distgit.ts

# The sig-promote report (workflow scope) joins this model's PackageFact output
# with koji promotion-tag NVRs and upstream OpenStack releases. Its remaining pure
# deps are bundled alongside: extensions/lib/{name_map,rpmvercmp}.ts (spec_sources.ts
# is already vendored for the model); sanitizeMarkdown and the upstream
# DeliverableEntry shape are inlined so the report needs no cross-extension source.
reports:
  - sig_promote.ts

platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64

labels:
  - centos
  - openstack
  - rdo
  - dist-git
  - gitlab
